<!DOCTYPE html>
<html lang="hi">
<head>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #090D16; color: #fff; padding: 12px; }
        .header { text-align: center; padding: 18px 10px; background: linear-gradient(135deg, #1E1B4B, #0F172A); border-radius: 14px; border: 1px solid rgba(245, 158, 11, 0.3); margin-bottom: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .header h1 { color: #F59E0B; font-size: 22px; font-weight: 800; letter-spacing: 1px; margin-bottom: 4px; }
        .header p { color: #94A3B8; font-size: 12px; margin-bottom: 12px; }
        .btn-download { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #F59E0B, #D97706); color: #0F172A; font-weight: 800; font-size: 13px; text-decoration: none; padding: 10px 20px; border-radius: 25px; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }
        
        .year-selector { display: flex; justify-content: center; gap: 12px; margin-bottom: 16px; }
        .year-btn { background: #131B2E; color: #94A3B8; border: 1.5px solid rgba(245, 158, 11, 0.3); padding: 10px 24px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .year-btn.active { background: linear-gradient(135deg, #F59E0B, #D97706); color: #090D16; border-color: #F59E0B; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        
        .months-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 500px; margin: 0 auto 20px auto; }
        .month-card { background: #131B2E; border: 1px solid rgba(245, 158, 11, 0.25); border-radius: 10px; padding: 14px 10px; text-align: center; color: #F8FAFC; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .month-card:hover:not(.disabled) { background: rgba(245, 158, 11, 0.15); border-color: #F59E0B; }
        .month-card.disabled { opacity: 0.35; cursor: not-allowed; border-color: rgba(255,255,255,0.1); color: #64748B; }
        
        .view-header { display: flex; justify-content: space-between; align-items: center; max-width: 700px; margin: 0 auto 12px auto; padding: 0 4px; }
        .view-title { color: #F59E0B; font-size: 16px; font-weight: bold; }
        .btn-back { background: #1E293B; color: #38BDF8; border: 1px solid rgba(56, 189, 248, 0.3); padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        
        .table-container { overflow-x: auto; background: #0F172A; border-radius: 12px; border: 1px solid rgba(245, 158, 11, 0.25); box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 700px; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; text-align: center; min-width: 580px; }
        th { background: #1E293B; color: #F59E0B; padding: 12px 6px; font-size: 13px; font-weight: bold; border-bottom: 2px solid rgba(245, 158, 11, 0.4); text-transform: uppercase; }
        td { padding: 10px 6px; font-size: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); font-weight: 600; }
        tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
        tr:hover { background: rgba(245, 158, 11, 0.08); }
        .date-col { color: #38BDF8; font-weight: 800; background: rgba(15, 23, 42, 0.6); }
        .num-badge { display: inline-block; min-width: 34px; padding: 3px 6px; border-radius: 6px; font-weight: bold; }
        .has-num { color: #F59E0B; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); }
        .empty-num { color: #475569; }
        .footer { text-align: center; margin-top: 25px; color: #64748B; font-size: 11px; }

<body>

    <div class="header">
        <h1>DISAWARKING MASTER CHART</h1>
        <p>Official Historical Results Archive (2 Years Record)</p>
        <div>
            <a href="https://github.com/disawarking-official/DisawarKingApp/releases/latest/download/app-release.apk" class="btn-download">
                <span>📲 DOWNLOAD OFFICIAL APP (APK)</span>
            </a>
        </div>
    </div>

    <div class="year-selector">
        <button id="btn2026" class="year-btn active" onclick="setYear('2026')">Year-2026</button>
        <button id="btn2025" class="year-btn" onclick="setYear('2025')">Year-2025</button>
    </div>

    <div id="monthsGrid" class="months-grid"></div>

    <div id="chartSection" style="display: none;">
        <div class="view-header">
            <span id="viewTitle" class="view-title">Chart</span>
            <button class="btn-back" onclick="backToGrid()">← Back to Months</button>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>DATE</th>
                        <th>DELHI BAZAR</th>
                        <th>SHREE GANESH</th>
                        <th>FARIDABAD</th>
                        <th>GHAZIABAD</th>
                        <th>GALI</th>
                        <th>DISAWAR</th>
                    </tr>
                </thead>
                <tbody id="chartBody"></tbody>
            </table>
        </div>
    </div>

    <div class="footer">
        © 2026 DisawarKing. All rights reserved. 18+ Only.
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAF1_OH3Szs8--OcwxHA11Fsj5x-iGSPIA",

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let liveFirestoreData = {};
        let pastArchive = {};
        let currentYear = "2026";
        let activeMonthNum = null;
        let activeMonthName = "";

        const allMonths = [
            { num: "01", name: "January" },
            { num: "02", name: "February" },
            { num: "03", name: "March" },
            { num: "04", name: "April" },
            { num: "05", name: "May" },
            { num: "06", name: "June" },
            { num: "07", name: "July" },
            { num: "08", name: "August" },
            { num: "09", name: "September" },
            { num: "10", name: "October" },
            { num: "11", name: "November" },
            { num: "12", name: "December" }
        ];

        fetch("record.csv")
            .then(res => res.text())
            .then(csv => {
                parseCsvData(csv);
                if (activeMonthNum) renderChart(activeMonthNum, activeMonthName);
            })
            .catch(() => {});

        function parseCsvData(csv) {
            const monthMap = {
                'Jan-25': '01-2025', 'Feb-25': '02-2025', 'Mar-25': '03-2025', 'Apr-25': '04-2025',
                'May-25': '05-2025', 'Jun-25': '06-2025', 'Jul-25': '07-2025', 'Aug-25': '08-2025',
                'Sep-25': '09-2025', 'Oct-25': '10-2025', 'Nov-25': '11-2025', 'Dec-25': '12-2025',
                'Jan-26': '01-2026', 'Feb-26': '02-2026', 'Mar-26': '03-2026', 'Apr-26': '04-2026',
                'May-26': '05-2026', 'Jun-26': '06-2026', 'Jul-26': '07-2026', 'Aug-26': '08-2026',
                'Sep-26': '09-2026'
            };

            const lines = csv.split('\n');
            let curMonth = null;

            lines.forEach(line => {
                const parts = line.trim().split(',');
                if (parts.length >= 7 && monthMap[parts[0]]) {
                    curMonth = monthMap[parts[0]];
                    if (!pastArchive[curMonth]) pastArchive[curMonth] = {};
                } else if (curMonth && parts.length >= 7 && !isNaN(parseInt(parts[0]))) {
                    const d = parseInt(parts[0]).toString().padStart(2, '0');
                    const clean = (v) => {
                        v = (v || '').trim();
                        if (v === '' || v === 'XX' || v === '--') return v || '--';
                        return (!isNaN(v) && v.length === 1) ? '0' + v : v;
                    };
                    pastArchive[curMonth][d] = {
                        "DISAWAR": clean(parts[1]),
                        "DELHI BAZAR": clean(parts[2]),
                        "SHREE GANESH": clean(parts[3]),
                        "FARIDABAD": clean(parts[4]),
                        "GHAZIABAD": clean(parts[5]),
                        "GALI": clean(parts[6])
                    };
                }
            });

            pastArchive["01-2025"] = {

                "11": {"DISAWAR": "84", "DELHI BAZAR": "91", "SHREE GANESH": "98", "FARIDABAD": "64", "GHAZIABAD": "19", "GALI": "31"},
                "12": {"DISAWAR": "63", "DELHI BAZAR": "30", "SHREE GANESH": "22", "FARIDABAD": "45", "GHAZIABAD": "19", "GALI": "66"},
                "13": {"DISAWAR": "40", "DELHI BAZAR": "99", "SHREE GANESH": "19", "FARIDABAD": "88", "GHAZIABAD": "39", "GALI": "75"},

                "28": {"DISAWAR": "74", "DELHI BAZAR": "89", "SHREE GANESH": "21", "FARIDABAD": "68", "GHAZIABAD": "45", "GALI": "49"},
                "29": {"DISAWAR": "34", "DELHI BAZAR": "83", "SHREE GANESH": "77", "FARIDABAD": "43", "GHAZIABAD": "85", "GALI": "66"},

            };
        }

        function renderMonthsGrid() {
            const grid = document.getElementById("monthsGrid");
            grid.innerHTML = "";
            const maxMonthIn2026 = 10;

            allMonths.forEach(m => {
                const mInt = parseInt(m.num);
                const isFuture = (currentYear === "2026" && mInt > maxMonthIn2026);

                const card = document.createElement("div");
                card.className = "month-card" + (isFuture ? " disabled" : "");
                card.innerText = m.name + (isFuture ? " (Coming Soon)" : "");

                if (!isFuture) {
                    card.onclick = () => openMonth(m.num, m.name);
                }
                grid.appendChild(card);
            });
        }

        db.collection("results_history").onSnapshot((snapshot) => {
            snapshot.forEach((doc) => {
                const data = doc.data();
                let mYear = data.monthYear || "";

                if (!mYear && doc.id.includes("_")) {
                    const parts = doc.id.split("_");
                    if (parts[0].includes("-")) mYear = parts[0];
                }
                if (!mYear) mYear = "10-2026";

                const dt = data.date ? data.date.toString().padStart(2, '0') : "";
                const market = data.market;
                const num = data.number;

                if (dt && market && num) {
                    if (!liveFirestoreData[mYear]) liveFirestoreData[mYear] = {};
                    if (!liveFirestoreData[mYear][dt]) liveFirestoreData[mYear][dt] = {};
                    liveFirestoreData[mYear][dt][market] = num;
                }
            });
            if (activeMonthNum) renderChart(activeMonthNum, activeMonthName);
        });

        function setYear(year) {
            currentYear = year;
            document.getElementById("btn2026").classList.toggle("active", year === "2026");
            document.getElementById("btn2025").classList.toggle("active", year === "2025");
            backToGrid();
            renderMonthsGrid();
        }

        function backToGrid() {
            activeMonthNum = null;
            document.getElementById("monthsGrid").style.display = "grid";
            document.getElementById("chartSection").style.display = "none";
        }

        function openMonth(monthNum, monthName) {
            activeMonthNum = monthNum;
            activeMonthName = monthName;
            document.getElementById("monthsGrid").style.display = "none";
            document.getElementById("chartSection").style.display = "block";
            document.getElementById("viewTitle").innerText = monthName + " " + currentYear + " Result Chart";
            renderChart(monthNum, monthName);
        }

        function renderChart(monthNum, monthName) {
            const monthKey = monthNum + "-" + currentYear;
            const tbody = document.getElementById("chartBody");
            tbody.innerHTML = "";

            const markets = ["DELHI BAZAR", "SHREE GANESH", "FARIDABAD", "GHAZIABAD", "GALI", "DISAWAR"];

            for (let day = 1; day <= 31; day++) {
                const dayStr = day.toString().padStart(2, '0');
                const row = document.createElement("tr");

                let dateCell = `<td class="date-col">${dayStr}</td>`;
                let cellsHtml = "";

                markets.forEach(m => {
                    let num = "--";

                    if (liveFirestoreData[monthKey] && liveFirestoreData[monthKey][dayStr] && liveFirestoreData[monthKey][dayStr][m]) {
                        num = liveFirestoreData[monthKey][dayStr][m];
                    } else if (pastArchive[monthKey] && pastArchive[monthKey][dayStr] && pastArchive[monthKey][dayStr][m]) {
                        num = pastArchive[monthKey][dayStr][m];
                    }

                    const badgeClass = (num !== "--" && num !== "XX" && num !== "") ? "num-badge has-num" : "num-badge empty-num";
                    const displayVal = (num === "" || num === undefined) ? "--" : num;
                    cellsHtml += `<td><span class="${badgeClass}">${displayVal}</span></td>`;
                });

                row.innerHTML = dateCell + cellsHtml;
                tbody.appendChild(row);
            }
        }

        renderMonthsGrid();
    </script>
</body>
</html>
