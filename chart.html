<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisawarKing - Old Result Chart Archive</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #090D16; color: #fff; padding: 12px; }
        .header { text-align: center; padding: 18px 10px; background: linear-gradient(135deg, #1E1B4B, #0F172A); border-radius: 14px; border: 1px solid rgba(245, 158, 11, 0.3); margin-bottom: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .header h1 { color: #F59E0B; font-size: 22px; font-weight: 800; letter-spacing: 1px; margin-bottom: 4px; }
        .header p { color: #94A3B8; font-size: 12px; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .controls label { color: #F59E0B; font-size: 13px; font-weight: bold; }
        select { background: #131B2E; color: #F59E0B; border: 1.5px solid #F59E0B; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: bold; outline: none; cursor: pointer; }
        .table-container { overflow-x: auto; background: #0F172A; border-radius: 12px; border: 1px solid rgba(245, 158, 11, 0.25); box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        table { width: 100%; border-collapse: collapse; text-align: center; min-width: 580px; }
        th { background: #1E293B; color: #F59E0B; padding: 12px 6px; font-size: 13px; font-weight: bold; border-bottom: 2px solid rgba(245, 158, 11, 0.4); text-transform: uppercase; }
        td { padding: 10px 6px; font-size: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); font-weight: 600; }
        tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
        tr:hover { background: rgba(245, 158, 11, 0.08); }
        .date-col { color: #38BDF8; font-weight: 800; background: rgba(15, 23, 42, 0.6); }
        .num-badge { display: inline-block; min-width: 34px; padding: 3px 6px; border-radius: 6px; font-weight: bold; }
        .has-num { color: #F59E0B; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); }
        .empty-num { color: #475569; }
        .footer { text-align: center; margin-top: 25px; color: #64748B; font-size: 11px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>DISAWARKING MASTER CHART</h1>
        <p>Official Historical Results Archive (2 Years Record)</p>
    </div>

    <div class="controls">
        <label for="monthSelect">CHOOSE MONTH:</label>
        <select id="monthSelect" onchange="renderChart()">
            <option value="10-2026" selected>October 2026 (Live Current)</option>
            <option value="09-2026">September 2026</option>
            <option value="08-2026">August 2026</option>
            <option value="07-2026">July 2026</option>
            <option value="06-2026">June 2026</option>
            <option value="05-2026">May 2026</option>
            <option value="04-2026">April 2026</option>
            <option value="03-2026">March 2026</option>
            <option value="02-2026">February 2026</option>
            <option value="01-2026">January 2026</option>
            <option value="12-2025">December 2025</option>
            <option value="11-2025">November 2025</option>
            <option value="10-2025">October 2025</option>
            <option value="09-2025">September 2025</option>
            <option value="08-2025">August 2025</option>
            <option value="07-2025">July 2025</option>
            <option value="06-2025">June 2025</option>
            <option value="05-2025">May 2025</option>
            <option value="04-2025">April 2025</option>
            <option value="03-2025">March 2025</option>
            <option value="02-2025">February 2025</option>
            <option value="01-2025">January 2025</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>DATE</th>
                    <th>DELHI BAZAR</th>
                    <th>SHREE GANESH</th>
                    <th>FARIDABAD</th>
                    <th>GHAZIABAD</th>
                    <th>GALI</th>
                    <th>DISAWAR</th>
                </tr>
            </thead>
            <tbody id="chartBody">
            </tbody>
        </table>
    </div>

    <div class="footer">
        © 2026 DisawarKing. All rights reserved. 18+ Only.
    </div>

    <script id="archive-script"></script>
    <script>
        // Firebase Setup for Live Sync
        const firebaseConfig = {
            apiKey: "AIzaSyAF1_OH3Szs8--OcwxHA11Fsj5x-iGSPIA",
            appId: "1:1015457895217:android:09cb8d98e56cc50b359610",
            messagingSenderId: "1015457895217",
            projectId: "disawarking-ead58"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let liveFirestoreData = {};

        // Realtime listener from mobile app
        db.collection("results_history").onSnapshot((snapshot) => {
            snapshot.forEach((doc) => {
                const data = doc.data();
                const mYear = data.monthYear || "10-2026";
                const dt = data.date;
                const market = data.market;
                const num = data.number;

                if (!liveFirestoreData[mYear]) liveFirestoreData[mYear] = {};
                if (!liveFirestoreData[mYear][dt]) liveFirestoreData[mYear][dt] = {};
                liveFirestoreData[mYear][dt][market] = num;
            });
            renderChart();
        });

        function renderChart() {
            const selectedMonth = document.getElementById("monthSelect").value;
            const tbody = document.getElementById("chartBody");
            tbody.innerHTML = "";

            const markets = ["DELHI BAZAR", "SHREE GANESH", "FARIDABAD", "GHAZIABAD", "GALI", "DISAWAR"];

            for (let day = 1; day <= 31; day++) {
                const dayStr = day.toString().padStart(2, '0');
                const row = document.createElement("tr");

                let dateCell = `<td class="date-col">${dayStr}</td>`;
                let cellsHtml = "";

                markets.forEach(m => {
                    let num = "--";
                    if (liveFirestoreData[selectedMonth] && liveFirestoreData[selectedMonth][dayStr] && liveFirestoreData[selectedMonth][dayStr][m]) {
                        num = liveFirestoreData[selectedMonth][dayStr][m];
                    } else if (window.pastArchive && window.pastArchive[selectedMonth] && window.pastArchive[selectedMonth][dayStr] && window.pastArchive[selectedMonth][dayStr][m]) {
                        num = window.pastArchive[selectedMonth][dayStr][m];
                    }

                    const badgeClass = (num !== "--" && num !== "XX") ? "num-badge has-num" : "num-badge empty-num";
                    cellsHtml += `<td><span class="${badgeClass}">${num}</span></td>`;
                });

                row.innerHTML = dateCell + cellsHtml;
                tbody.appendChild(row);
            }
        }
    </script>
    <script src="data.js"></script>
    <script>
        if (window.pastArchive) {
            renderChart();
        }
    </script>
</body>
</html>
