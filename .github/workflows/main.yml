name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Android Project & Permissions
        run: |
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create . --platforms=android --org=com.disawarking.app --project-name=disawarkingapp --overwrite
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/pubspec.yaml.bak pubspec.yaml

          # Permissions & Cleartext Traffic (itel / Android 13 fix)
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml || true
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml || true

          # google-services.json copy
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/ || true
          fi

          # minSdk 21 fix & MultiDex
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i '/defaultConfig {/a \        multiDexEnabled true' android/app/build.gradle || true

      - name: Build APK for All Devices (Universal)
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DisawarKing-App
          path: build/app/outputs/flutter-apk/app-release.apk
