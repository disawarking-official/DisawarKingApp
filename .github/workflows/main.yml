name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix Android Permissions & Config
        run: |
          # Copy Firebase Config agar root me ho
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/ || true
          fi

          # Min SDK 21 fix
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle || true

          # Internet Permissions Fix
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"\/>\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' android/app/src/main/AndroidManifest.xml || true

      - name: Build Universal Release APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DisawarKing-App
          path: build/app/outputs/flutter-apk/app-release.apk
