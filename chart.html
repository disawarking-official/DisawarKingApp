    <script id="archive-script">
        // Firebase Setup
        const firebaseConfig = {

            messagingSenderId: "1015457895217",
            projectId: "disawarking-ead58"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let liveFirestoreData = {};

        // Realtime Firestore Listener
        db.collection("results_history").onSnapshot((snapshot) => {
            snapshot.forEach((doc) => {
                const data = doc.data();
                let mYear = data.monthYear || "";
                
                // Doc ID se monthYear nikaalna agar data me na ho
                if (!mYear && doc.id.includes("_")) {
                    const parts = doc.id.split("_");
                    if (parts[0].includes("-")) {
                        mYear = parts[0];
                    }
                }
                
                // September data default
                if (!mYear) {
                    mYear = "09-2026";
                }

                const dt = data.date ? data.date.toString().padStart(2, '0') : "";
                const market = data.market;
                const num = data.number;

                if (dt && market && num) {
                    if (!liveFirestoreData[mYear]) liveFirestoreData[mYear] = {};
                    if (!liveFirestoreData[mYear][dt]) liveFirestoreData[mYear][dt] = {};
                    liveFirestoreData[mYear][dt][market] = num;
                }
            });
            renderChart();
        });

        // Online 2-Year Master Archive Load Karein
        let pastArchive = {};
        fetch("record.csv")
            .then(res => res.text())
            .then(csvText => {
                parseCsvToArchive(csvText);
                renderChart();
            })
            .catch(() => {
                renderChart();
            });

        function parseCsvToArchive(csv) {
            const monthsOrder = [
                "02-2025", "03-2025", "04-2025", "05-2025", "06-2025", "07-2025",
                "08-2025", "09-2025", "10-2025", "11-2025", "12-2025", "01-2026",
                "02-2026", "03-2026", "04-2026", "05-2026", "06-2026", "07-2026",
                "08-2026", "09-2026"
            ];
            
            // January 2025 Pre-fill
            pastArchive["01-2025"] = {
                "01": { "DISAWAR": "XX", "DELHI BAZAR": "92", "SHREE GANESH": "84", "FARIDABAD": "35", "GHAZIABAD": "44", "GALI": "47" },
                "02": { "DISAWAR": "00", "DELHI BAZAR": "35", "SHREE GANESH": "08", "FARIDABAD": "70", "GHAZIABAD": "33", "GALI": "54" },

                "08": { "DISAWAR": "99", "DELHI BAZAR": "92", "SHREE GANESH": "95", "FARIDABAD": "43", "GHAZIABAD": "03", "GALI": "71" },
                "09": { "DISAWAR": "73", "DELHI BAZAR": "58", "SHREE GANESH": "15", "FARIDABAD": "96", "GHAZIABAD": "26", "GALI": "68" },

                "11": { "DISAWAR": "84", "DELHI BAZAR": "91", "SHREE GANESH": "98", "FARIDABAD": "64", "GHAZIABAD": "19", "GALI": "31" },
                "12": { "DISAWAR": "63", "DELHI BAZAR": "30", "SHREE GANESH": "22", "FARIDABAD": "45", "GHAZIABAD": "19", "GALI": "66" },
                "13": { "DISAWAR": "40", "DELHI BAZAR": "99", "SHREE GANESH": "19", "FARIDABAD": "88", "GHAZIABAD": "39", "GALI": "75" },

            };

            const lines = csv.split('\n');
            let mIndex = -1;

            lines.forEach(line => {
                const parts = line.split(',');
                if (line.includes("Dt,DS,DL,SG,FB,GD,GL")) {
                    mIndex++;
                } else if (mIndex >= 0 && mIndex < monthsOrder.length && parts.length >= 7) {
                    const dNum = parseInt(parts[0].trim());
                    if (!isNaN(dNum)) {
                        const curMonth = monthsOrder[mIndex];
                        if (!pastArchive[curMonth]) pastArchive[curMonth] = {};
                        const dStr = dNum.toString().padStart(2, '0');
                        pastArchive[curMonth][dStr] = {
                            "DISAWAR": parts[1].trim().padStart(2, '0'),
                            "DELHI BAZAR": parts[2].trim().padStart(2, '0'),
                            "SHREE GANESH": parts[3].trim().padStart(2, '0'),
                            "FARIDABAD": parts[4].trim().padStart(2, '0'),
                            "GHAZIABAD": parts[5].trim().padStart(2, '0'),
                            "GALI": parts[6].trim().padStart(2, '0')
                        };
                    }
                }
            });
        }

        function renderChart() {
            const selectedMonth = document.getElementById("monthSelect").value;
            const tbody = document.getElementById("chartBody");
            tbody.innerHTML = "";

            const markets = ["DELHI BAZAR", "SHREE GANESH", "FARIDABAD", "GHAZIABAD", "GALI", "DISAWAR"];

            for (let day = 1; day <= 31; day++) {
                const dayStr = day.toString().padStart(2, '0');
                const row = document.createElement("tr");

                let dateCell = `<td class="date-col">${dayStr}</td>`;
                let cellsHtml = "";

                markets.forEach(m => {
                    let num = "--";

                    // 1. Live Firestore Check
                    if (liveFirestoreData[selectedMonth] && liveFirestoreData[selectedMonth][dayStr] && liveFirestoreData[selectedMonth][dayStr][m]) {
                        num = liveFirestoreData[selectedMonth][dayStr][m];
                    }
                    // 2. 2-Year Archive Check
                    else if (pastArchive[selectedMonth] && pastArchive[selectedMonth][dayStr] && pastArchive[selectedMonth][dayStr][m]) {
                        num = pastArchive[selectedMonth][dayStr][m];
                    }

                    const badgeClass = (num !== "--" && num !== "XX" && num !== "") ? "num-badge has-num" : "num-badge empty-num";
                    const displayVal = (num === "" || num === undefined) ? "--" : num;
                    cellsHtml += `<td><span class="${badgeClass}">${displayVal}</span></td>`;
                });

                row.innerHTML = dateCell + cellsHtml;
                tbody.appendChild(row);
            }
        }

        renderChart();
    </script>
